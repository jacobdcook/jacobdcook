# Generate GitHub stats card and commit it to the repo so the README
# displays it from GitHub (no external fetch = no "Error Fetching Resource").
name: Update README stats card

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Generated by our own script (scripts/generate_stats_card.py) instead of a
      # third-party action: the action started committing its own error card when
      # its API call failed. The script exits non-zero on any API failure, so the
      # last good card stays in place instead.
      - name: Generate stats card
        run: python3 scripts/generate_stats_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh Recently shipped section
        run: python3 scripts/generate_recent_work.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg README.md
          git diff --staged --quiet || (git commit -m "Update GitHub stats card" && git push)
