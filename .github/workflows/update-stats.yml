# Generate GitHub stats card and commit it to the repo so the README
# displays it from GitHub (no external fetch = no "Error Fetching Resource").
name: Update README stats card

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=jacobdcook&show_icons=true&hide_rank=true&hide=stars&include_all_commits=true
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --staged --quiet || (git commit -m "Update GitHub stats card" && git push)
